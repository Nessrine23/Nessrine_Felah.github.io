<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CV | Nessrine Felah</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b16;
            color: white;
            text-align: center;
        }

        .top-bar {
            padding: 20px;
            background: #10101d;
            border-bottom: 1px solid #252538;
        }

        .back-button {
            display: inline-block;

            padding: 12px 25px;

            background: #8b5cf6;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            transition: 0.3s ease;
        }

        .back-button:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .cv-container {
            padding: 30px;
        }

        .cv-container h1 {
            margin-bottom: 20px;
        }

        .cv-viewer {
            width: 90%;
            max-width: 1000px;
            height: 1100px;

            border: none;

            border-radius: 10px;

            background: white;
        }

    </style>

</head>

<body>

    <div class="top-bar">

        <a href="index.html" class="back-button">
            ← Back to Portfolio
        </a>

    </div>


    <div class="cv-container">

        <h1>My CV</h1>

        <iframe
            src="cv_Nessrine_Felah.pdf"
            class="cv-viewer">
        </iframe>

    </div>

</body>

</html>
